[package]
name = "amigo_render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
editor = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit"]
asset_streaming = []
gpu_physics = []

[dependencies]
amigo_core = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
bytemuck = { workspace = true }
tracing = { workspace = true }
image = { workspace = true }
rustc-hash = { workspace = true }
fontdue = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# Validates game post shaders on the CPU before the GPU sees them.
naga = { workspace = true }
# Blocks on wgpu error scopes when building a post shader pipeline.
pollster = { workspace = true }
egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }
egui-winit = { workspace = true, optional = true }

[dev-dependencies]
epaint_default_fonts = { workspace = true }
ron = { workspace = true }

[lints]
workspace = true
