name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: amigo

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the target mapping in install.sh / install.ps1 --
        # a triple the installers offer but this matrix does not build is a 404.
        #
        # aarch64-unknown-linux-gnu is deliberately absent: gilrs -> libudev-sys
        # and kira -> alsa-sys resolve through pkg-config and need arm64 .pc/.so
        # files, which the amd64 -dev packages installed here do not provide.
        # Cross-compiling it needs an arm64 sysroot (dpkg --add-architecture or
        # cross-rs); until that exists, ARM Linux builds from source.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-system-deps

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p amigo_cli -p amigo_artgen -p amigo_audiogen

      # The MCP configs written by `amigo connect` reference amigo-artgen and
      # amigo-audiogen on PATH, so they ship in the same archive as amigo.
      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          STAGING="amigo-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}" "$STAGING/"
          cp "target/${{ matrix.target }}/release/amigo-artgen" "$STAGING/"
          cp "target/${{ matrix.target }}/release/amigo-audiogen" "$STAGING/"
          tar czf "${STAGING}.tar.gz" "$STAGING"
          echo "ASSET=${STAGING}.tar.gz" >> $GITHUB_ENV

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "amigo-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging -Force
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe" "$staging/"
          Copy-Item "target/${{ matrix.target }}/release/amigo-artgen.exe" "$staging/"
          Copy-Item "target/${{ matrix.target }}/release/amigo-audiogen.exe" "$staging/"
          Compress-Archive -Path "$staging/*" -DestinationPath "$staging.zip"
          echo "ASSET=$staging.zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: amigo-${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    name: Create Release
    # No `if: always()` here on purpose: this job must not run when a build leg
    # failed. A release carrying only some platforms' binaries is worse than a
    # loud failure -- install.sh resolves `releases/latest` and would then 404
    # for everyone on a missing platform.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts/ -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          ls -la release-assets/
          # One archive per build-matrix entry. Guards against a silently
          # partial release if artifact upload or download degrades.
          expected=4
          actual=$(find release-assets/ -type f \( -name "*.tar.gz" -o -name "*.zip" \) | wc -l)
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::expected ${expected} release archives, found ${actual}" >&2
            exit 1
          fi

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*
