name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the run for the previous push. Runs on main are
# never cancelled, so every merge commit gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Every cargo invocation lives in the justfile, so `just ci` locally and this
# workflow cannot drift apart. Jobs only differ in which recipes they run.
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just fmt-check

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-system-deps
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Fails when Cargo.lock is out of date with the manifests, so every later
      # step builds exactly the committed dependency versions.
      - name: Lockfile is up to date
        run: cargo fetch --locked
      - run: just check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-system-deps
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-hack
      - run: just clippy
      - run: just clippy-features

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-system-deps
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just test
      # The feature matrix and doc tests are platform-independent; running
      # them once is enough.
      - if: runner.os == 'Linux'
        run: just test-features
      - if: runner.os == 'Linux'
        run: just test-doc

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-system-deps
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # The recipe sets RUSTDOCFLAGS="-D warnings"; CONTRIBUTING.md promises
      # that CI fails on doc warnings.
      - run: just doc
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: target/doc/

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Advisories, licenses, banned/duplicate crates and sources, per deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2

  release-build:
    name: Release Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-system-deps
      - run: cargo build --release --locked --target ${{ matrix.target }} -p amigo_engine -p amigo_cli
