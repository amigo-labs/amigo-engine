name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-system-deps
      - name: Check workspace (crates, tools, examples)
        run: cargo check --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-system-deps
      - name: Clippy workspace
        run: cargo clippy --workspace -- -D warnings
      - name: Clippy feature flags
        run: |
          cargo clippy -p amigo_core --features async_tasks -- -D warnings
          cargo clippy -p amigo_assets --features asset_streaming -- -D warnings
          cargo clippy -p amigo_render --features asset_streaming -- -D warnings
          cargo clippy -p amigo_net --features rollback_net -- -D warnings
          cargo clippy -p amigo_audio --features audio_graph -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-system-deps
      - name: Run tests
        run: cargo test --workspace
      - name: Test feature flags
        run: |
          cargo test -p amigo_core --features async_tasks
          cargo test -p amigo_assets --features asset_streaming
          cargo test -p amigo_render --features asset_streaming
          cargo test -p amigo_net --features rollback_net
          cargo test -p amigo_audio --features audio_graph
      - name: Doc tests
        run: |
          cargo test --doc \
            -p amigo_tidal_parser \
            -p amigo_audio_pipeline

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-system-deps
      - name: Build docs
        run: |
          cargo doc --no-deps \
            -p amigo_core \
            -p amigo_render \
            -p amigo_audio \
            -p amigo_input \
            -p amigo_tidal_parser \
            -p amigo_audio_pipeline \
            -p amigo_engine
        env:
          RUSTDOCFLAGS: ""
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: target/doc/

  release-build:
    name: Release Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-system-deps
      - run: cargo build --release --target ${{ matrix.target }} -p amigo_engine -p amigo_cli
