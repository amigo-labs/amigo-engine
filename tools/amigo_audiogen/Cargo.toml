[package]
name = "amigo_audiogen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server for AI audio generation (ACE-Step music, AudioGen SFX)"

# The MCP configs (`amigo connect`, .mcp.json) launch `amigo-audiogen`, so
# the binary uses the hyphenated name (same convention as amigo-artgen).
[[bin]]
name = "amigo-audiogen"
path = "src/main.rs"

[dependencies]
amigo_comfyui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ron = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
